# P3-1：-Xmx2g 偏小（AGP 9 + R8 minify + shrinkResources 的 release 构建有 OOM 风险），提至 3g
org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
# P3-2：开本地构建缓存（parallel + config-cache 已开，补齐最后一块）
org.gradle.caching=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 资源优化（resource path shortening）属性已随 AGP 9 移除（AGP 9 deprecated、AGP 10 报错）。
# 动态引用资源（PortraitImage 的 getIdentifier）由 res/raw/keep.xml 的 tools:keep 保护不被删除；
# 资源名是否被缩短需在构建后用 APK 实测验证（见 AGENTS.md）。
