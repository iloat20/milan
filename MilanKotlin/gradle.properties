org.gradle.jvmargs=-Xmx2g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official
# 禁用资源优化（resource path shortening）：R8 会把 drawable/char_*.png 重命名成
# res/xx.png 短名，PortraitImage 用 getIdentifier(characterId) 动态加载会全部失配。
# 属性在 AGP 8.x 仍有效（AGP 9 才移除）；shrinkResources 继续工作，
# 动态引用资源由 res/raw/keep.xml 的 tools:keep 保护不被删除。
android.enableResourceOptimizations=false
