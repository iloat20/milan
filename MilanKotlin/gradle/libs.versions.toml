[versions]
# AGP 9.4.0（2026-09 minor）；wrapper 已升 9.7.1
agp = "9.4.0"
kotlin = "2.4.20"
coreKtx = "1.19.0"
lifecycle = "2.11.0"
activityCompose = "1.13.0"
composeBom = "2026.09.00"
serialization = "1.11.0"
coroutines = "1.11.0"
junit = "4.13.2"
profileinstaller = "1.4.1"
media3 = "1.11.1"
materialIcons = "1.7.8"
navigationCompose = "2.10.1"
glance = "1.2.0"
# WorkManager 显式接入（2026-08 每日补给本地提醒）：此前仅经 Glance 传递携带，app 无法引用其 API
work = "2.11.2"
benchmark = "1.5.0"
uiautomator = "2.4.0"
testRunner = "1.6.2"
testExtJunit = "1.3.0"
# Robolectric：在 JVM 上运行 Compose UI 测试（无需模拟器/真机），支持 compileSdk 37
robolectric = "4.16.1"
# Konsist：编译期架构测试（层规则 / 包依赖），替代纯正则 checkArchitecture 的增量门禁
konsist = "0.17.3"
# detekt：静态分析基线（1.23.x 稳定线；2.x 仍 alpha 时不默认上）
detekt = "1.23.8"
# Kotest property：经济/保底不变量属性测试（可独立于 Kotest runner）
kotestProperty = "5.9.1"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { group = "androidx.lifecycle", name = "lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-runtime-compose = { group = "androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-ktx = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { group = "androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { group = "androidx.activity", name = "activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { group = "androidx.compose", name = "compose-bom", version.ref = "composeBom" }
androidx-ui = { group = "androidx.compose.ui", name = "ui" }
androidx-ui-tooling = { group = "androidx.compose.ui", name = "ui-tooling" }
androidx-ui-tooling-preview = { group = "androidx.compose.ui", name = "ui-tooling-preview" }
# Compose BOM 2026.09.00 默认 material3 = 1.4.0（稳定版），MaterialExpressiveTheme 已毕业为非实验。
# 此前 BOM 2026.06.01 的 material3 仍为 alpha，需显式覆盖到 1.5.0-alpha22；现已无需覆盖。
androidx-material3 = { group = "androidx.compose.material3", name = "material3" }
androidx-compose-material-icons-core = { group = "androidx.compose.material", name = "material-icons-core", version.ref = "materialIcons" }
kotlinx-serialization-json = { group = "org.jetbrains.kotlinx", name = "kotlinx-serialization-json", version.ref = "serialization" }
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-coroutines-test = { group = "org.jetbrains.kotlinx", name = "kotlinx-coroutines-test", version.ref = "coroutines" }
androidx-profileinstaller = { group = "androidx.profileinstaller", name = "profileinstaller", version.ref = "profileinstaller" }
androidx-media3-exoplayer = { group = "androidx.media3", name = "media3-exoplayer", version.ref = "media3" }
androidx-navigation-compose = { group = "androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
androidx-glance-appwidget = { group = "androidx.glance", name = "glance-appwidget", version.ref = "glance" }
androidx-work-runtime-ktx = { group = "androidx.work", name = "work-runtime-ktx", version.ref = "work" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-benchmark = { group = "androidx.benchmark", name = "benchmark-macro-junit4", version.ref = "benchmark" }
androidx-uiautomator = { group = "androidx.test.uiautomator", name = "uiautomator", version.ref = "uiautomator" }
androidx-test-runner = { group = "androidx.test", name = "runner", version.ref = "testRunner" }
# benchmark 模块的 AndroidJUnit4 来源（StartupBenchmark.kt 引用；此前缺失导致模块一旦接入即编译失败，P2-5）
androidx-test-ext-junit = { group = "androidx.test.ext", name = "junit", version.ref = "testExtJunit" }
# Compose UI 测试（2026-08-28 P0）：版本由 compose BOM 统一管理，无需指定 version
androidx-ui-test-junit4 = { group = "androidx.compose.ui", name = "ui-test-junit4" }
androidx-ui-test-manifest = { group = "androidx.compose.ui", name = "ui-test-manifest" }
robolectric = { group = "org.robolectric", name = "robolectric", version.ref = "robolectric" }
konsist = { group = "com.lemonappdev", name = "konsist", version.ref = "konsist" }
kotest-property = { group = "io.kotest", name = "kotest-property-jvm", version.ref = "kotestProperty" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
# AGP 9 默认启用 built-in Kotlin，org.jetbrains.kotlin.android 插件不再应用（AGP 内置 KGP 2.2.10，
# 版本由根 build.gradle.kts 的 buildscript classpath 提升到 2.4.20，与 [versions] kotlin 对齐）
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
detekt = { id = "io.gitlab.arturbosch.detekt", version.ref = "detekt" }
