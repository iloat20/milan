# Milan 最小 CI：架构门禁 + 打包守卫 + 单测 + Debug APK
#
# 范围刻意收窄（2026-09-11 升级报告 Wave 1）：
# - checkArchitecture：领域纯净 / VM 接线 / UI 无业务单例直连
# - checkNoPackagedBackups：preBuild 自动挂载，禁止 .bak 进 source set
# - :app:testDebugUnitTest：JUnit4 + coroutines-test + Robolectric Compose
# - :app:assembleDebug：可安装 Debug 包（不做 release 签名 / R8，避免密钥依赖）
#
# 触发：main 推送与 PR。工作目录固定 MilanKotlin/。
# 需要真机的任务（:benchmark / BaselineProfile）不在本流水线。

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Test + Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: MilanKotlin
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Architecture gate
        run: ./gradlew checkArchitecture --stacktrace

      - name: Unit tests
        run: ./gradlew :app:testDebugUnitTest --stacktrace

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: |
            MilanKotlin/app/build/reports/tests/testDebugUnitTest
            MilanKotlin/app/build/test-results/testDebugUnitTest
          retention-days: 7

      - name: Assemble Debug APK
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload Debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: MilanKotlin/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
          if-no-files-found: error
