<style>
  :root{--bg:#0a0a12;--card:#14141f;--line:#2a2a3a;--txt:#e8e8f0;--sub:#9a9ab0;--gold:#f6d88a;}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(circle at 50% -10%,#1a1a2e,#0a0a12 60%);color:var(--txt);
       font-family:-apple-system,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;padding:28px}
  h1{font-size:22px;font-weight:700;letter-spacing:1px;margin:0 0 4px}
  h1 span{color:var(--gold)}
  .sub{color:var(--sub);font-size:13px;margin-bottom:22px}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:16px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;
        display:flex;flex-direction:column;transition:transform .15s,border-color .15s}
  .card:hover{transform:translateY(-3px);border-color:var(--gold)}
  .imgwrap{aspect-ratio:1/1;background:radial-gradient(circle at 50% 45%,#1d1d2e,#0c0c14);
           display:flex;align-items:center;justify-content:center;padding:10px}
  .imgwrap img{width:100%;height:100%;object-fit:contain;filter:drop-shadow(0 0 14px rgba(120,140,255,.25))}
  figcaption{padding:10px 12px 13px}
  .name{font-size:15px;font-weight:600;display:flex;align-items:center;gap:7px}
  .badge{font-size:11px;font-weight:700;color:#0a0a12;background:var(--gold);border-radius:6px;padding:1px 7px}
  .title{font-size:11.5px;color:var(--sub);margin-top:3px;min-height:28px;line-height:1.3}
  .wname{font-size:12.5px;color:var(--gold);margin-top:5px;font-weight:600}
